<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Calculadora</title>
</head>
<body>
    <div class="principal">
    <input type="text" id="visor" >
    <br>
   <button type="button" class="sinal" id="dividir">÷</button>
   <button type="button" class="sinal" id="multiplicar">×</button>
   <button type="button" class="sinal" id="mais">+</button>
    <button type="button" class="apag">⌫</button><br>
   <button type="button" class="num" id="btn1">1</button>
   <button type="button" class="num" id="btn2">2</button>
   <button type="button" class="num" id="btn3">3</button>
   <button type="button" class="sinal" id="menos">-</button><br>
   <button type="button" class="num" id="btn4">4</button>
   <button type="button" class="num" id="btn5">5</button>
   <button type="button" class="num" id="btn6">6</button>
   <button type="button" class="sinal" id="virg"> , </button><br>
   <button type="button" class="num" id="btn7">7</button>
   <button type="button" class="num" id="btn8">8</button>
   <button type="button" class="num" id="btn9">9</button>
   <button type="button" class="igual" id="igual">=</button><br>
   <button type="button" class="vazio">9</button>
   <button type="button" class="num" id="btn0">0</button>
   <button type="button" class="vazio">9</button>
   </div>
   <script src="script.js"></script>
</body>
</html>
